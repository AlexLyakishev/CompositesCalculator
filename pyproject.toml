# Tool settings only (the libraries are plain modules for now, not an installable package).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"  # the Python version Pyodide 0.26 runs in the browser

[tool.ruff.lint]
# real errors only: syntax errors, undefined names, misused comparisons. Widen this list as the code is tidied.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# runs in the same Pyodide namespace as py/bridge.py, so np, _API and _build come from there
"py/shape_bridge.py" = ["F821"]
